spring.application.name=propstack-backend

# Started via the repo-root docker-compose.yml (`docker compose up -d`), not managed by Spring Boot.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/propstack}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:propstack}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:propstack}

# Flyway owns the schema; Hibernate only validates that entity mappings match it.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

server.port=8080

app.cors.allowed-origins=http://localhost:4200

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/PropStack}

keycloak.admin.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8081}
keycloak.admin.realm=PropStack
keycloak.admin.client-id=propstack-backend
keycloak.admin.client-secret=${KEYCLOAK_BACKEND_CLIENT_SECRET:dev-only-propstack-backend-secret}
