name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend

jobs:
  # Backend Tests
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: propstack
          POSTGRES_USER: propstack
          POSTGRES_PASSWORD: propstack
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 26
      uses: actions/setup-java@v4
      with:
        java-version: '26'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Run backend tests
      working-directory: backend
      run: ./mvnw -B clean test

    - name: Generate test report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Backend Tests
        path: backend/target/surefire-reports/*.xml
        reporter: java-junit

  # Frontend Tests and Build
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: frontend
      run: npm ci

    - name: Run linting
      working-directory: frontend
      run: npm run lint

    - name: Run unit tests
      working-directory: frontend
      run: npm run test:ci

    - name: Build application
      working-directory: frontend
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist/frontend/browser/

  # Security Scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 26
      uses: actions/setup-java@v4
      with:
        java-version: '26'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Resolve backend dependencies
      working-directory: backend
      run: ./mvnw -B dependency:go-offline
      # Populates ~/.m2 so Trivy's pom.xml analyzer resolves BOM/parent-managed versions
      # from the local repo instead of querying repo.maven.apache.org directly, which
      # gets rate-limited (429) on shared GitHub-hosted runner IPs.

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: trivy-results
        path: trivy-results.sarif
        retention-days: 30

  # Tag a release when pom.xml/package.json's version actually changed on main.
  # Image builds happen separately, in release-images.yml, triggered by these tags -
  # not on every push to main.
  tag-release:
    name: Tag Release
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Set up JDK 26
      uses: actions/setup-java@v4
      with:
        java-version: '26'
        distribution: 'temurin'

    - name: Tag backend release if version changed
      working-directory: backend
      run: |
        NEW=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
        OLD=$(git show HEAD^:backend/pom.xml | sed '/<parent>/,/<\/parent>/d' | grep -oPm1 '(?<=<version>)[^<]+(?=</version>)' || echo "")
        if [ -n "$OLD" ] && [ "$OLD" != "$NEW" ]; then
          echo "Backend version changed: $OLD -> $NEW"
          git tag -a "backend-v$NEW" -m "Backend v$NEW"
          git push origin "backend-v$NEW"
        else
          echo "Backend version unchanged ($NEW) - no tag."
        fi

    - name: Tag frontend release if version changed
      working-directory: frontend
      run: |
        NEW=$(node -p "require('./package.json').version")
        OLD=$(git show HEAD^:frontend/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo "")
        if [ -n "$OLD" ] && [ "$OLD" != "$NEW" ]; then
          echo "Frontend version changed: $OLD -> $NEW"
          git tag -a "frontend-v$NEW" -m "Frontend v$NEW"
          git push origin "frontend-v$NEW"
        else
          echo "Frontend version unchanged ($NEW) - no tag."
        fi
